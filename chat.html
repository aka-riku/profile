
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好きな食べ物チャット</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <div class="chat-container">

        <header>
            <h1>好きな食べ物トーク</h1>
        </header>

        <main class="chat-area">

            <div class="message-row left">
                <div class="message">
                    こんにちは！好きな食べ物は何ですか？
                </div>
            </div>

            <div class="message-row right">
                <div class="message">
                    こんにちは！僕はラーメンが好きです！
                </div>
            </div>

            <div class="message-row left">
                <div class="message">
                    ラーメンいいですね！何味が好きですか？
                </div>
            </div>

            <div class="message-row right">
                <div class="message">
                    味噌ラーメンが特に好きです。でもカレーも大好きです！
                </div>
            </div>

            <div class="message-row left">
                <div class="message">
                    カレーもおいしいですよね！どちらを食べるか迷いませんか？
                </div>
            </div>

            <div class="message-row right">
                <div class="message">
                    いつも迷います！だから曜日によって食べるものを決めようと思っています。
                </div>
            </div>

        </main>

        <footer>
            <input type="text" placeholder="メッセージを入力...">
            <button>送信</button>
        </footer>

    </div>

</body>
</html>
